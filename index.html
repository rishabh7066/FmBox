<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>गाँव की यादें — Village Radio</title>
<meta name="description" content="90 के दशक के गाँव के गीत — nostalgia radio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- background art direction: landscape image on wide screens, portrait crop on narrow -->
  <picture class="bg-picture">
    <source media="(max-width: 720px)" srcset="village-portrait.jpg">
    <img src="immg.png" alt="" class="bg-image" id="bgImage">
  </picture>
  <div class="bg-scrim"></div>
  <div class="grain"></div>

  <div class="page">

    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <div class="wordmark">
        <span class="wordmark-hi">गाँव की यादें</span>
        <span class="wordmark-en">village radio</span>
      </div>

      <nav class="platform-links" aria-label="Playlist par sunein">
        <a id="spotifyLink" href="#" target="_blank" rel="noopener" class="platform-btn">
          <svg viewBox="0 0 24 24" class="platform-icon" aria-hidden="true"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.6 14.4c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.9-9.3-1-.4.1-.7-.1-.8-.5-.1-.4.1-.7.5-.8 4-.9 7.5-.5 10.3 1.2.3.2.4.6.2.9zm1.2-2.8c-.2.4-.7.5-1.1.3-2.9-1.8-7.3-2.3-10.7-1.3-.4.1-.9-.1-1-.6-.1-.4.1-.9.6-1 3.9-1.2 8.7-.6 12 1.4.4.2.5.8.2 1.2zm.1-2.9C14.6 8.6 9.3 8.4 6.2 9.4c-.5.2-1.1-.1-1.3-.6-.2-.5.1-1.1.6-1.3 3.6-1.1 9.4-.9 13.1 1.3.5.3.6.9.4 1.4-.3.4-.9.6-1.4.3z"/></svg>
          <span>Spotify</span>
        </a>
        <a id="ytMusicLink" href="#" target="_blank" rel="noopener" class="platform-btn">
          <svg viewBox="0 0 24 24" class="platform-icon" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 16.5c-3.59 0-6.5-2.91-6.5-6.5S8.41 5.5 12 5.5s6.5 2.91 6.5 6.5-2.91 6.5-6.5 6.5zM10 8.64v6.72L15.27 12 10 8.64z"/></svg>
          <span>YT Music</span>
        </a>
      </nav>
    </header>

    <!-- ===== Hero copy ===== -->
    <main class="hero">
      <p class="eyebrow">दोपहर की धूप, बरगद की छाँव</p>
      <h1 class="headline">गाँव की <span class="headline-accent">यादें</span></h1>
      <p class="subline">वो 90's वाले गाने, जो आज भी दिल में बसे हैं</p>
    </main>

    <!-- ===== Player ===== -->
    <section class="player" aria-label="Music player">

      <div class="player-card">

        <div class="cover-wrap">
          <img id="coverArt" class="cover-art" src="" alt="">
          <div class="lantern" id="lantern" aria-hidden="true">
            <svg viewBox="0 0 40 60" class="lantern-svg">
              <line x1="20" y1="0" x2="20" y2="8" stroke="#5a3d22" stroke-width="2"/>
              <path d="M10 8 h20 l-3 6 h-14 z" fill="#3a2416"/>
              <rect x="9" y="14" width="22" height="28" rx="3" fill="#d9a441" class="lantern-glass" opacity="0.85"/>
              <rect x="9" y="14" width="22" height="28" rx="3" fill="none" stroke="#3a2416" stroke-width="1.5"/>
              <line x1="20" y1="14" x2="20" y2="42" stroke="#3a2416" stroke-width="1.5"/>
              <path d="M8 42 h24 l-4 8 h-16 z" fill="#3a2416"/>
              <circle cx="20" cy="28" r="9" class="lantern-flame" fill="#fff3d0"/>
            </svg>
          </div>
        </div>

        <div class="track-info">
          <h2 class="track-title" id="trackTitle">—</h2>
          <p class="track-artist" id="trackArtist">—</p>

          <div class="progress-row">
            <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
          </div>
          <p class="time-row"><span id="currentTime">0:00</span> / <span id="durationTime">0:00</span></p>
        </div>

        <div class="controls-row">
          <button class="ctrl-btn" id="prevBtn" aria-label="Pichla gaana">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 20L9 12L19 4V20Z" fill="currentColor"/>
              <rect x="5" y="4" width="2.5" height="16" rx="1.25" fill="currentColor"/>
            </svg>
          </button>

          <button class="play-btn" id="playBtn" aria-label="Play">
            <!-- Play icon -->
            <svg viewBox="0 0 24 24" id="playIcon" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
              <path d="M9.5 7.5L17 12L9.5 16.5V7.5Z" fill="currentColor"/>
            </svg>
            <!-- Pause icon -->
            <svg viewBox="0 0 24 24" id="pauseIcon" hidden fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
              <rect x="8" y="7" width="2.8" height="10" rx="1.4" fill="currentColor"/>
              <rect x="13.2" y="7" width="2.8" height="10" rx="1.4" fill="currentColor"/>
            </svg>
          </button>

          <button class="ctrl-btn" id="nextBtn" aria-label="Agla gaana">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 4L15 12L5 20V4Z" fill="currentColor"/>
              <rect x="16.5" y="4" width="2.5" height="16" rx="1.25" fill="currentColor"/>
            </svg>
          </button>
        </div>

      </div>
    </section>

    <footer class="site-footer">
      <p>बना है अपनों की यादों के लिए</p>
    </footer>

  </div>

  <!-- Hidden YouTube IFrame Player -->
  <div id="ytPlayerWrap" style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
    <div id="ytPlayer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
